<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web Tech Example</title>
    
    <!-- 1. CSS: Controls the visual look and feel -->
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f7f6;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .interactive-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        .interactive-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- 2. HTML: Defines the content structure -->
    <div class="container">
        <h1>Welcome to Web Tech!</h1>
        <p>Click the button below to see JavaScript work in real-time.</p>
        <button class="interactive-btn" id="actionButton">Click Me!</button>
    </div>

    <!-- 3. JavaScript: Adds life and dynamic behavior -->
    <script>
        const button = document.getElementById('actionButton');
        
        button.addEventListener('click', () => {
            button.textContent = '✅ Success!';
            button.style.backgroundColor = '#28a745';
            document.body.style.backgroundColor = '#e8f5e9';
        });
    </script>

</body>
</html>
